name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ALLOW_PAID_ANALYSIS: 'false'
  ALLOW_SUPERMEMORY: 'false'
  ALLOW_DATABASE: 'false'
  GEMINI_API_KEY: ''
  SUPERMEMORY_API_KEY: ''
  DATABASE_URL: ''
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, unit tests, build and Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg and ffprobe for local media fixtures
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit, route and local integration tests
        run: npm test
      # Build generates .next/types and next-env.d.ts required by a clean checkout.
      - name: Build without external services
        run: npm run build
      - name: Typecheck generated Next.js contracts
        run: npm run typecheck
      - name: Test private credential helpers with temporary fixtures
        # @next/env preserves even empty inherited keys; let this test load its own
        # synthetic dotenv values. Service-enable flags remain false.
        run: env -u GEMINI_API_KEY -u SUPERMEMORY_API_KEY -u DATABASE_URL python3 -m unittest discover -s scripts -p 'test_*.py'

  browser:
    name: Playwright desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js LTS and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test loopback UI with synthetic video and mocked providers
        run: npm run test:e2e
